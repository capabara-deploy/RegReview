# DigitalOcean App Platform spec — the static site (apps/web) ONLY.
#
# The API (apps/server) deliberately does NOT live here: it needs persistent
# local disk for uploaded documents and holds in-memory review-job state,
# neither of which survive on App Platform's stateless Service containers.
# It runs on a Droplet instead, built from the repo's Dockerfile directly —
# see Dockerfile / docker-entrypoint.sh.
#
# Declaring an explicit app spec (rather than letting the console
# auto-detect) is deliberate: this repo's top-level `packages/` directory
# (an npm workspace convention) has the same shape App Platform's
# auto-detector uses to recognize a Functions project, and it previously
# misidentified this whole repo as one. An explicit spec with only a
# `static_sites` component sidesteps that detection entirely.

name: regreview-web
region: nyc
static_sites:
  - name: web
    github:
      repo: HowIsThatRude/RegReview
      branch: korea
      deploy_on_push: true
    # Root, not apps/web: npm workspaces need the lockfile at the repo root
    # to resolve, so the install has to happen there even though only the
    # web workspace gets built.
    source_dir: /
    build_command: npm ci && npm run build -w @regreview/web
    output_dir: apps/web/dist
    envs:
      - key: VITE_API_URL
        scope: BUILD_TIME
        # The Droplet's Caddy container terminates TLS for this hostname and
        # proxies to the API on :8787. Must be https: the site is served over
        # https, and browsers block an http API call from it (mixed content).
        value: "https://167.71.105.204.sslip.io"
