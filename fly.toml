# One instance per customer.
#
# Isolation by deployment rather than by code: a separate app, a separate volume,
# a separate password. It is the simplest arrangement that is actually correct
# about "customer A cannot see customer B's documents", and it is the answer a
# security review can verify rather than take on trust. Copy this file per
# customer and change `app`.
app = "regreview-demo"
primary_region = "iad"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8787"
  REGREVIEW_DB = "/data/regreview.db"
  REGREVIEW_UPLOAD_DIR = "/data/uploads"
  REGREVIEW_WEB_ROOT = "/app/apps/web/dist"

[[mounts]]
  source = "regreview_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # A review runs as a background job in this process's memory. Stopping the
  # machine mid-review strands it — the run is reconciled to "failed" on the next
  # boot rather than silently lost, but the work is still gone and paid for.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  # Reviews are IO-bound on the model API rather than CPU-bound, but PDF parsing
  # and four concurrent check passes want more than the smallest instance.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
